apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app.kubernetes.io/name: {{ include "arcadedb-cluster.name" . | default "arcadedb-cluster" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: 2480
    - name: bolt
      port: {{ .Values.service.boltPort }}
      targetPort: 7687
    - name: gremlin
      port: {{ .Values.service.gremlinPort }}
      targetPort: 8182
    - name: redis
      port: {{ .Values.service.redisPort }}
      targetPort: 6379
    - name: postgres
      port: {{ .Values.service.postgresPort }}
      targetPort: 5432
  selector:
    app.kubernetes.io/name: {{ include "arcadedb-cluster.name" . | default "arcadedb-cluster" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
