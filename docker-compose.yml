version: '3.8'

services:
  # ============================================================================
  # ArcadeDB Standalone (Single Node with Multi-Model, Cypher, Bolt & Vector)
  # ============================================================================
  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: arcadedb-standalone
    restart: unless-stopped
    ports:
      - "2480:2480"   # HTTP REST / Studio / GraphQL
      - "2424:2424"   # Binary Protocol
      - "7687:7687"   # Bolt Protocol (Neo4j driver drop-in compatibility)
      - "8182:8182"   # Gremlin Server / TinkerPop
      - "6379:6379"   # Redis Protocol Emulation
      - "5432:5432"   # Postgres Wire Protocol Emulation
    environment:
      - ARCADE_ROOT_PASSWORD=arcadepassword
      - JAVA_OPTS=-Xms1g -Xmx2g -Darcadedb.server.rootPassword=arcadepassword -Darcadedb.server.plugins=Bolt:com.arcadedb.server.bolt.BoltPlugin,GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin,Postgres:com.arcadedb.postgres.PostgresProtocolPlugin,Redis:com.arcadedb.redis.RedisProtocolPlugin -Darcadedb.server.defaultDatabases=EnterpriseTopology[root:arcadepassword:admin]
    volumes:
      - ./data/arcadedb:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u root:arcadepassword http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - graph-network

  # ============================================================================
  # Neo4j Community (Comparison & Benchmarking Instance)
  # ============================================================================
  neo4j:
    image: neo4j:5.26.0-community
    container_name: neo4j-standalone
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser / HTTP
      - "7688:7687"   # Neo4j Bolt (mapped to 7688 to prevent collision with ArcadeDB on 7687)
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - graph-network

  # ============================================================================
  # Optional 3-Node ArcadeDB Raft Cluster (Profile: cluster)
  # Run with: docker-compose --profile cluster up -d
  # ============================================================================
  arcadedb-node1:
    image: arcadedata/arcadedb:latest
    container_name: arcadedb-cluster-node1
    profiles: ["cluster"]
    ports:
      - "2481:2480"
      - "7681:7687"
    environment:
      - ARCADE_ROOT_PASSWORD=arcadepassword
      - JAVA_OPTS=-Xms512m -Xmx1g -Darcadedb.server.nodeName=node1 -Darcadedb.server.mode=distributed -Darcadedb.server.plugins=Bolt:com.arcadedb.server.bolt.BoltPlugin
    volumes:
      - ./data/cluster/node1:/home/arcadedb/databases
    networks:
      - graph-network

  arcadedb-node2:
    image: arcadedata/arcadedb:latest
    container_name: arcadedb-cluster-node2
    profiles: ["cluster"]
    ports:
      - "2482:2480"
      - "7682:7687"
    environment:
      - ARCADE_ROOT_PASSWORD=arcadepassword
      - JAVA_OPTS=-Xms512m -Xmx1g -Darcadedb.server.nodeName=node2 -Darcadedb.server.mode=distributed -Darcadedb.server.plugins=Bolt:com.arcadedb.server.bolt.BoltPlugin
    volumes:
      - ./data/cluster/node2:/home/arcadedb/databases
    networks:
      - graph-network

  arcadedb-node3:
    image: arcadedata/arcadedb:latest
    container_name: arcadedb-cluster-node3
    profiles: ["cluster"]
    ports:
      - "2483:2480"
      - "7683:7687"
    environment:
      - ARCADE_ROOT_PASSWORD=arcadepassword
      - JAVA_OPTS=-Xms512m -Xmx1g -Darcadedb.server.nodeName=node3 -Darcadedb.server.mode=distributed -Darcadedb.server.plugins=Bolt:com.arcadedb.server.bolt.BoltPlugin
    volumes:
      - ./data/cluster/node3:/home/arcadedb/databases
    networks:
      - graph-network

networks:
  graph-network:
    driver: bridge
